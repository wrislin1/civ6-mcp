# Operational v9 resume after the T163 funding drain wedge.
# T157-T162 are complete on the final timeline; reload 0_MCP_0163 and re-run
# T163-T186 inclusive: 24 rounds x 4 seats = 96 admissions. Keep the original
# 24-seat game-turn slack (120 total). All treatment settings match committed v9.
run_id: arena-channels-behavior-v9
max_puppet_turns: 96
max_game_turns: 120
channel_rules:
  acceptance_turns: 3
  funding_turns: 2
  payment_response_turns: 2
civs:
  - player: 0
    provider: scripted
    model: seat0-smoke
    attention: {mode: "off"}
  - player: 1
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: minimal
    max_steps: 15
    task_tracker: {enabled: true}
    channels: {enabled: true, guidance: true}
  - player: 2
    provider: local
    model: qwen3.6-27b
    gateway: http://192.168.20.196:11441/v1
    tools: minimal
    max_steps: 15
    task_tracker: {enabled: true}
    channels: {enabled: true, guidance: true}
  - player: 3
    provider: scripted
    channels:
      enabled: true
      auto_accept: true
      script:
        - turn: 157
          action: propose_deal
          args:
            to_player: 1
            text: "I'll pay you 50 gold if you keep your military units at least 3 tiles away from my lands for the next few turns. A simple deal to build trust between us."
            favor:
              term_type: keep_units_away
              params: {player_id: 3, min_distance: 3, unit_scope: military}
            payment_gold: 50
            timing: on_delivery
            within: 5
        - turn: 157
          action: propose_deal
          args:
            to_player: 2
            text: "I'll pay you 50 gold if you keep your military units at least 3 tiles away from my lands for the next few turns. A simple deal to build trust between us."
            favor:
              term_type: keep_units_away
              params: {player_id: 3, min_distance: 3, unit_scope: military}
            payment_gold: 50
            timing: on_delivery
            within: 5
        - turn: 170
          action: send_message
          args:
            to_player: 1
            text: "Our borders have been peaceful, and I would like to keep relations constructive. If you see a mutually beneficial arrangement, I am open to hearing it."
        - turn: 170
          action: send_message
          args:
            to_player: 2
            text: "Our borders have been peaceful, and I would like to keep relations constructive. If you see a mutually beneficial arrangement, I am open to hearing it."

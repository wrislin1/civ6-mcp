# Stage-2 live gate: real cli-claude seat 0 + the same two local-LLM puppets.
# Widened budgets (36) give the LLM pilot more turns than the scripted stage.
# Supply a unique --run-id per run; never bake one into this file.
#
# YAML traps guarded by experiment.py (both load-time ValueErrors if broken):
#   * keep mode: "off" quoted -- a bare `off` is PyYAML boolean False.
#   * never give tools/max_steps/result_char_cap/gateway to the cli-claude seat --
#     those knobs are local-only.
max_puppet_turns: 36
max_game_turns: 36
idle_poll_limit: 600
gateway_url: http://192.168.20.196:11444/v1
civs:
  - player: 0
    provider: cli-claude
    model: ""
    attention: {mode: "off"}
  - player: 1
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: full
    max_steps: 8
    attention: {mode: "off"}
  - player: 2
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: full
    max_steps: 8
    attention: {mode: "off"}

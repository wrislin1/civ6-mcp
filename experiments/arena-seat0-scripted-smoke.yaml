# Stage-1 live gate: deterministic scripted seat 0 + two local-LLM puppets.
# Reproducible by construction -- the scripted seat makes no LLM call, so the
# only variance is the two gemma puppets. Supply a unique --run-id per run;
# never bake one into this file.
#
# YAML traps guarded by experiment.py (both load-time ValueErrors if broken):
#   * keep mode: "off" quoted -- a bare `off` is PyYAML boolean False, which
#     _parse_attention rejects.
#   * never give tools/max_steps/result_char_cap/gateway to the scripted seat --
#     those knobs are local-only.
max_puppet_turns: 24
max_game_turns: 24
idle_poll_limit: 600
gateway_url: http://192.168.20.196:11444/v1
civs:
  - player: 0
    provider: scripted
    model: seat0-smoke
    attention: {mode: "off"}
  - player: 1
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: full
    max_steps: 8
    attention: {mode: "off"}
  - player: 2
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: full
    max_steps: 8
    attention: {mode: "off"}

# 8-civ, 50-turn live run. You play seat 0.
# Seats 1,3,5 are LLM puppets (all gemma4-26b on GPU0 :11440 -- one model, no swap-thrash).
# Seats 2,4,6,7 are omitted intentionally and remain regular game AI.
# 3 puppets x 50 rounds = 150 total puppet turns. max_steps NOT trimmed (10).
max_puppet_turns: 150
idle_poll_limit: 10800         # generous poll budget across a multi-turn, human-paced run
gateway_url: http://192.168.20.196:11444/v1   # fallback; each civ pins :11440 below
civs:
  - player: 1
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: full
    result_char_cap: 6000
    max_steps: 10
    playbook: condensed
    context_budget: auto
    memory:
      enabled: true
      max_chars: 1200
    task_tracker:
      enabled: true
      max_tasks: 8
    briefing:
      enabled: true
      map_radius: 3
      sections: [promotions, overview, units, cities, map, research, production_options, threats, rivals, empire_resources, great_people, victory]

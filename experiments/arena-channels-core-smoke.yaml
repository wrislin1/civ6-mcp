# Deterministic unofficial-channels live gate (spec 2026-07-17).
# The prior failed two-seat run directory cannot be reused: adding the privacy
# observer changes the canonical enabled-player identity, so the new run_id
# prevents accidental continuation of incompatible channel state.
# v2: v1 failed terminally at the restart checkpoint (seat-bound payment-state
# query run from the observer/human seat); a failed gate journal is terminal,
# so each rerun needs a fresh run_id.
# v3: v2 failed terminally at the same checkpoint with status=absent — the
# engine auto-resolves deals offered to an AI player before the round
# boundary. Spec revision 2 (same-round settlement) is the response.
# v4: v3 failed terminally with official_payment_auto_resolved after proving
# AI->AI PROPOSED deal enactment is synchronous at send. Spec revision 3
# responds with fund-window settlement verification and ledger-only response.
run_id: arena-channels-core-gate-v4
# 24 captures expected on revision 2's eight-round path; 36 leaves room for
# watcher handoff and deterministic blocker cleanup. Validation recomputes the
# scenario minimum from channel_rules rather than trusting this number.
max_puppet_turns: 36
max_game_turns: 36
channel_rules:
  acceptance_turns: 3
  funding_turns: 2
  payment_response_turns: 2
live_gate:
  enabled: true
  scenario: unofficial_channels_core_v1
  roles:
    api_actor: 1
    cli_actor: 2
    privacy_observer: 3
civs:
  - player: 1
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: full
    channels: {enabled: true}
  - player: 2
    provider: cli-codex
    model: gpt-5.5
    channels: {enabled: true}
  - player: 3
    provider: scripted
    channels: {enabled: true}

# Fifth operational resume of committed v6 after scripted seat 0 parked on an
# unused-envoy blocker at T172. Forty-four successful captures are on the final
# timeline; the failed T167 and T172 seat-0 captures are excluded.
run_id: arena-channels-behavior-v6
max_puppet_turns: 76
max_game_turns: 100
channel_rules:
  acceptance_turns: 3
  funding_turns: 2
  payment_response_turns: 2
civs:
  - player: 0
    provider: scripted
    model: seat0-smoke
    attention: {mode: "off"}
  - player: 1
    provider: local
    model: gemma4-26b
    gateway: http://192.168.20.196:11440/v1
    tools: minimal
    max_steps: 15
    channels: {enabled: true, guidance: true}
  - player: 2
    provider: local
    model: qwen3.6-27b
    gateway: http://192.168.20.196:11441/v1
    tools: minimal
    max_steps: 15
    channels: {enabled: true, guidance: true}
  - player: 3
    provider: scripted
    channels:
      enabled: true
      auto_accept: true
      script:
        - turn: 157
          action: propose_deal
          args:
            to_player: 1
            text: "I'll pay you 50 gold if you keep your military units at least 3 tiles away from my lands for the next few turns. A simple deal to build trust between us."
            favor:
              term_type: keep_units_away
              params: {player_id: 3, min_distance: 3, unit_scope: military}
            payment_gold: 50
            timing: on_delivery
            within: 5
        - turn: 157
          action: propose_deal
          args:
            to_player: 2
            text: "I'll pay you 50 gold if you keep your military units at least 3 tiles away from my lands for the next few turns. A simple deal to build trust between us."
            favor:
              term_type: keep_units_away
              params: {player_id: 3, min_distance: 3, unit_scope: military}
            payment_gold: 50
            timing: on_delivery
            within: 5
